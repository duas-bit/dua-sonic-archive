
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sai's Sonic Archive | Lunar Archive</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #080B19;
    color: #F2D99A;
    font-family: 'VT323', monospace;
    overflow-x: hidden;
}

.sky {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(2px 2px at 100px 120px, #F2D99A, transparent),
        radial-gradient(1px 1px at 200px 80px, #fff, transparent);
    background-size: 350px 250px;
    animation: drift 120s linear infinite;
}

@keyframes drift {
    to { background-position: 350px 250px; }
}

header {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 30px 15px 15px;
}

h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(13px, 2.5vw, 22px);
    line-height: 1.8;
    margin: 0 0 12px;
}

.subtitle {
    font-size: 24px;
}

.back-button {
    display: inline-block;
    margin-top: 10px;
    color: #F2D99A;
    text-decoration: none;
    font-size: 22px;
}

main {
    position: relative;
    z-index: 2;
    width: min(900px, 94%);
    margin: 15px auto 40px;
    padding: 20px;
    background: rgba(16, 20, 43, 0.72);
    border: 1px solid rgba(242, 217, 154, 0.25);
}

.month-heading {
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(12px, 2vw, 18px);
    margin: 10px 0 25px;
}

.weekdays, .calendar {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 12px;
    text-align: center;
}

.weekdays {
    margin-bottom: 15px;
    font-size: 21px;
    color: #B7A9D5;
}

.day {
    min-height: 85px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 20px;
}

.moon {
    position: relative;
    width: 34px;
    height: 34px;
    display: block;
    border: 2px solid #B9B3B0;
    border-radius: 50%;
    background: #B9B3B0;
    box-shadow: 0 0 12px rgba(242, 217, 154, 0.4);
    cursor: pointer;
    image-rendering: pixelated;
}

.moon::before {
    content: "";
    position: absolute;
    width: 8px;
    height: 7px;
    left: 6px;
    top: 7px;
    background: #77758A;
    box-shadow:
        10px 9px 0 #9993A0,
        3px 17px 0 #9993A0;
}

.day.completed .moon {
    background: #F2D99A;
    border-color: #F2D99A;
    box-shadow: 0 0 15px rgba(242, 217, 154, 0.8);
}

.day.no-music .moon {
    background: #D8C5A0;
    border-color: #D8C5A0;
    box-shadow: 0 0 15px rgba(216, 197, 160, 0.7);
}

.day.today .moon {
    outline: 2px solid #E9A6C8;
    outline-offset: 5px;
}

.day.future {
    opacity: 0.22;
}

.day.future .moon {
    cursor: not-allowed;
    box-shadow: none;
}

.day.empty {
    visibility: hidden;
}

.playlist {
    display: block;
    width: fit-content;
    margin: 30px auto 5px;
    padding: 12px 20px;
    border: 2px solid #F2D99A;
    color: #F2D99A;
    background: transparent;
    font-family: 'VT323', monospace;
    font-size: 22px;
    cursor: not-allowed;
    opacity: 0.45;
}

.legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 25px;
    font-size: 19px;
}

.legend span {
    display: flex;
    align-items: center;
    gap: 7px;
}

.legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #F2D99A;
    display: inline-block;
}

.legend-dot.future-dot { opacity: 0.25; }
.legend-dot.today-dot { background: #E9A6C8; }

@media(max-width: 600px) {
    main {
        padding: 12px 7px;
    }

    .weekdays, .calendar {
        gap: 4px;
    }

    .weekdays {
        font-size: 17px;
    }

    .day {
        min-height: 65px;
        font-size: 17px;
    }

    .moon {
        width: 23px;
        height: 23px;
    }

    .moon::before {
        width: 5px;
        height: 5px;
        left: 4px;
        top: 4px;
        box-shadow: 7px 6px 0 #9993A0, 2px 12px 0 #9993A0;
    }

    .legend {
        gap: 10px;
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="sky"></div>

<header>
    <h1>LUNAR ARCHIVE</h1>
    <div class="subtitle">your days among the stars.</div>
    <a class="back-button" href="solar-system.html">← BACK</a>
</header>

<main>
    <div class="month-heading">JANUARY 2027</div>

    <div class="weekdays">
        <div>SUN</div><div>MON</div><div>TUE</div>
        <div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
    </div>

    <div class="calendar" id="calendar"></div>

    <button class="playlist" disabled>
        ♫ MONTHLY PLAYLIST — LOCKED
    </button>

    <div class="legend">
        <span><i class="legend-dot"></i> Logged</span>
        <span><i class="legend-dot today-dot"></i> Today</span>
        <span><i class="legend-dot future-dot"></i> Upcoming</span>
    </div>
</main>

<script>
const daysInMonth = 31;
const firstDay = 5; // January 1, 2027 = Friday
const today = 6; // Temporary sample date

const calendar = document.getElementById("calendar");

// Empty spaces before January 1
for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    calendar.appendChild(empty);
}

// Sample daily entries
for (let day = 1; day <= daysInMonth; day++) {
    const cell = document.createElement("div");
    cell.className = "day";

    if (day < today) {
        cell.classList.add(day === 3 ? "no-music" : "completed");
    } else if (day === today) {
        cell.classList.add("today");
    } else {
        cell.classList.add("future");
    }

    cell.innerHTML = `
        <span>${day}</span>
        <div class="moon"></div>
    `;

    if (day <= today) {
        cell.style.cursor = "pointer";
        cell.addEventListener("click", () => {
            window.location.href = `entry.html?day=${day}`;
        });
    }

    calendar.appendChild(cell);
}
</script>

</body>
</html>
