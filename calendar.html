
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sai's Sonic Archive | Monthly Log</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #080B19;
    color: #F2D99A;
    font-family: 'VT323', monospace;
    overflow-x: hidden;
}

.sky {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(2px 2px at 100px 120px, #F2D99A, transparent),
        radial-gradient(1px 1px at 200px 80px, #fff, transparent);
    background-size: 350px 250px;
    animation: drift 120s linear infinite;
}

@keyframes drift {
    to { background-position: 350px 250px; }
}

header {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 30px 15px 15px;
}

h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(13px, 2.5vw, 22px);
    line-height: 1.8;
    margin: 0 0 12px;
}

.subtitle {
    font-size: 24px;
}

.back-button {
    display: inline-block;
    margin-top: 10px;
    color: #F2D99A;
    text-decoration: none;
    font-size: 22px;
}

main {
    position: relative;
    z-index: 2;
    width: min(900px, 94%);
    margin: 15px auto 40px;
    padding: 20px;
    background: rgba(16, 20, 43, 0.72);
    border: 1px solid rgba(242, 217, 154, 0.25);
}

.month-heading {
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(12px, 2vw, 18px);
    margin: 10px 0 25px;
}

.weekdays, .calendar {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 12px;
    text-align: center;
}

.weekdays {
    margin-bottom: 15px;
    font-size: 21px;
    color: #B7A9D5;
}

.day {
    min-height: 85px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 20px;
}

/* PIXELATED MOON SURFACE */
.moon {
    position:relative;
    width:38px;
    height:38px;
    display:block;
    border-radius:50%;
    overflow:hidden;
    background:#DCCBA8;
    border:2px solid #F2D99A;
    box-shadow:0 0 12px rgba(242,217,154,.35);
    image-rendering:pixelated;
}

.moon::before {
    content:"";
    position:absolute;
    inset:0;
    z-index:2;
    background:#34344D;
}

.moon::after {
    display:none;
}

/* NEW MOON */
.phase-0 { background:#34344D; }
.phase-0::before { display:none; }

/* WAXING CRESCENT — light on right */
.phase-1::before {
    clip-path:polygon(
        0 0,100% 0,100% 100%,0 100%,
        0 85%,15% 85%,15% 70%,
        25% 70%,25% 30%,15% 30%,15% 15%
    );
}

/* FIRST QUARTER — light on right */
.phase-2::before {
    clip-path:inset(0 0 0 50%);
}

/* WAXING GIBBOUS — small shadow on left */
.phase-3::before {
    clip-path:polygon(
        0 0,100% 0,100% 100%,0 100%,
        0 15%,12% 15%,12% 30%,
        20% 30%,20% 70%,12% 70%,12% 85%
    );
}

/* FULL MOON */
.phase-4::before { display:none; }

/* WANING GIBBOUS — small shadow on right */
.phase-5::before {
    clip-path:polygon(
        0 0,100% 0,100% 100%,0 100%,
        100% 15%,88% 15%,88% 30%,
        80% 30%,80% 70%,88% 70%,88% 85%
    );
}

/* THIRD QUARTER — light on left */
.phase-6::before {
    clip-path:inset(0 50% 0 0);
}

/* WANING CRESCENT — light on left */
.phase-7::before {
    clip-path:polygon(
        0 0,100% 0,100% 100%,0 100%,
        100% 85%,85% 85%,85% 70%,
        75% 70%,75% 30%,85% 30%,85% 15%
    );
}

/* NO MUSIC: INVERTED COLOURWAY */
.day.no-music .moon {
    background:#34344D;
    border-color:#B7A9D5;
    box-shadow:0 0 15px rgba(183,169,213,.5);
}

.day.no-music .moon::before {
    background:#DCCBA8;
}
    
.day.completed .moon {
    background: #F2D99A;
    border-color: #F2D99A;
    box-shadow: 0 0 15px rgba(242, 217, 154, 0.8);
}

.day.no-music .moon {
    background: #D8C5A0;
    border-color: #D8C5A0;
    box-shadow: 0 0 15px rgba(216, 197, 160, 0.7);
}

.day.today .moon {
    outline: 2px solid #E9A6C8;
    outline-offset: 5px;
}

.day.future {
    opacity: 0.22;
}

.day.future .moon {
    cursor: not-allowed;
    box-shadow: none;
}

.day.empty {
    visibility: hidden;
}

.playlist {
    display: block;
    width: fit-content;
    margin: 30px auto 5px;
    padding: 12px 20px;
    border: 2px solid #F2D99A;
    color: #F2D99A;
    background: transparent;
    font-family: 'VT323', monospace;
    font-size: 22px;
    cursor: not-allowed;
    opacity: 0.45;
}

.legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 25px;
    font-size: 19px;
}

.legend span {
    display: flex;
    align-items: center;
    gap: 7px;
}

.legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #F2D99A;
    display: inline-block;
}

.legend-dot.future-dot { opacity: 0.25; }
.legend-dot.today-dot { background: #E9A6C8; }

@media(max-width: 600px) {
    main {
        padding: 12px 7px;
    }

    .weekdays, .calendar {
        gap: 4px;
    }

    .weekdays {
        font-size: 17px;
    }

    .day {
        min-height: 65px;
        font-size: 17px;
    }

    .moon {
        width: 23px;
        height: 23px;
    }

    .moon::before {
        width: 5px;
        height: 5px;
        left: 4px;
        top: 4px;
        box-shadow: 7px 6px 0 #9993A0, 2px 12px 0 #9993A0;
    }

    .legend {
        gap: 10px;
        font-size: 16px;
    }
}

/* PIXEL-ART LUNAR LANDING */
.lunar-landing {
    position:relative;
    height:190px;
    margin-top:65px;
    overflow:hidden;
}

.landing-moon {
    position:absolute;
    bottom:-115px;
    left:50%;
    transform:translateX(-50%);
    width:460px;
    height:230px;
    border-radius:50% 50% 0 0;
    background:#DCCBA8;
    border:4px solid #F2D99A;
    box-shadow:0 -8px 30px rgba(242,217,154,.2);
}

/* PIXEL ASTRONAUT */
.astronaut {
    position:absolute;
    bottom:35px;
    left:calc(50% - 65px);
    width:55px;
    height:105px;
    z-index:2;
    image-rendering:pixelated;
}

.helmet {
    position:absolute;
    top:0;
    left:8px;
    width:40px;
    height:39px;
    background:#E9D8B5;
    border:4px solid #F2D99A;
    border-radius:8px;
    z-index:3;
}

.visor {
    position:absolute;
    top:7px;
    left:5px;
    width:22px;
    height:17px;
    background:#96664D;
    border:3px solid #B7A9D5;
}

.suit {
    position:absolute;
    top:39px;
    left:10px;
    width:36px;
    height:39px;
    background:#E9D8B5;
    border:3px solid #B7A9D5;
}

.suit-detail {
    position:absolute;
    top:5px;
    left:7px;
    color:#171323;
    font-size:18px;
}

.astronaut-arm {
    position:absolute;
    top:44px;
    width:11px;
    height:29px;
    background:#E9D8B5;
    border:3px solid #B7A9D5;
}

.astronaut-arm.left { left:0; }
.astronaut-arm.right { right:0; }

.astronaut-leg {
    position:absolute;
    top:76px;
    width:15px;
    height:23px;
    background:#E9D8B5;
    border:3px solid #B7A9D5;
}

.astronaut-leg.left { left:9px; }
.astronaut-leg.right { left:29px; }

/* MUSIC FLAG */
.flagpole {
    position:absolute;
    bottom:35px;
    left:calc(50% + 75px);
    width:4px;
    height:90px;
    background:#F2D99A;
    z-index:2;
}

.landing-flag {
    position:absolute;
    bottom:85px;
    left:calc(50% + 79px);
    width:58px;
    height:35px;
    background:#B7A9D5;
    color:#171323;
    font-family:'VT323',monospace;
    font-size:27px;
    text-align:center;
    line-height:35px;
    clip-path:polygon(0 0,100% 0,85% 100%,0 100%);
    z-index:2;
}

@media(max-width:600px) {
    .lunar-landing {
        height:150px;
        margin-top:45px;
    }

    .landing-moon {
        width:340px;
        height:170px;
        bottom:-90px;
    }

    .astronaut {
        transform:scale(.8);
        transform-origin:bottom;
        bottom:25px;
    }

    .flagpole { bottom:25px; height:70px; }
    .landing-flag { bottom:65px; }
}

@media(max-width:600px) {
    .moon {
        width:23px;
        height:23px;
        flex-shrink:0;
    }

    .moon::before {
        inset:0;
    }
}

</style>
</head>

<body>

<div class="sky"></div>

<header>
    <div class="subtitle">pick a phase.</div>
    <a class="back-button" href="solar-system.html">← BACK</a>
</header>

<main>
    <div class="month-heading">JANUARY 2027</div>

    <div class="weekdays">
        <div>SUN</div><div>MON</div><div>TUE</div>
        <div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
    </div>

    <div class="calendar" id="calendar"></div>

    <button class="playlist" disabled>
        ♫ MONTHLY PLAYLIST — LOCKED
    </button>

    <div class="legend">
        <span><i class="legend-dot"></i> Logged</span>
        <span><i class="legend-dot today-dot"></i> Today</span>
        <span><i class="legend-dot future-dot"></i> Upcoming</span>
    </div>
</main>

<script>
const daysInMonth = 31;
const firstDay = 5; // January 1, 2027 = Friday
const today = 6; // Temporary sample date

const calendar = document.getElementById("calendar");

// Empty spaces before January 1
for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    calendar.appendChild(empty);
}

// Sample daily entries
for (let day = 1; day <= daysInMonth; day++) {
    const cell = document.createElement("div");
    cell.className = "day";

    if (day < today) {
        cell.classList.add(day === 3 ? "no-music" : "completed");
    } else if (day === today) {
        cell.classList.add("today");
    } else {
        cell.classList.add("future");
    }

    const phase = (day - 1) % 8;
    
    cell.innerHTML = `
        <span>${day}</span>
        <div class="moon phase-${phase}"></div>
    `;

    if (day <= today) {
        cell.style.cursor = "pointer";
        cell.addEventListener("click", () => {
            window.location.href = `entry.html?day=${day}`;
        });
    }

    calendar.appendChild(cell);
}
</script>

<div class="lunar-landing">

    <div class="landing-moon"></div>

    <div class="astronaut">
        <!-- Helmet -->
        <div class="helmet">
            <div class="visor"></div>
        </div>

        <!-- Suit -->
        <div class="suit">
            <div class="suit-detail">♫</div>
        </div>

        <!-- Arms -->
        <div class="astronaut-arm left"></div>
        <div class="astronaut-arm right"></div>

        <!-- Legs -->
        <div class="astronaut-leg left"></div>
        <div class="astronaut-leg right"></div>
    </div>

    <!-- Flag -->
    <div class="flagpole"></div>
    <div class="landing-flag">♫</div>

</div>
</body>
</html>
