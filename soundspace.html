
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sai's Sonic Archive | The SoundSpace</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    background: #080B19;
    color: #F2D99A;
    font-family: 'VT323', monospace;
}

.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background-color: #080B19;

    background-image:
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(2px 2px at 100px 120px, #F2D99A, transparent),
        radial-gradient(1px 1px at 200px 80px, #fff, transparent),
        radial-gradient(2px 2px at 300px 200px, #fff, transparent),
        radial-gradient(3px 3px at 75px 180px, #C9B7F0, transparent),
        radial-gradient(2px 2px at 250px 65px, #A9D0E8, transparent),
        radial-gradient(2px 2px at 180px 220px, #E8A6C8, transparent);

    background-size: 350px 250px;
    animation: drift 120s linear infinite;
}

@keyframes drift {
    from { background-position: 0 0; }
    to { background-position: 350px 250px; }
}
    
.sky::before {
    content: "";
    position: absolute;
    inset: -10%;

    background:
        radial-gradient(ellipse at 18% 30%,
            rgba(119, 97, 168, 0.32), transparent 35%),

        radial-gradient(ellipse at 78% 22%,
            rgba(83, 111, 168, 0.28), transparent 38%),

        radial-gradient(ellipse at 52% 75%,
            rgba(164, 95, 134, 0.25), transparent 36%),

        radial-gradient(ellipse at 92% 70%,
            rgba(193, 138, 101, 0.19), transparent 30%),

        radial-gradient(ellipse at 12% 85%,
            rgba(100, 142, 170, 0.22), transparent 32%);

    filter: blur(45px);
    pointer-events: none;
}

.sky::after {
    content: "";
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(3px 3px at 15% 20%, #FFF4D2 99%, transparent),
        radial-gradient(4px 4px at 38% 42%, #C9B7F0 99%, transparent),
        radial-gradient(3px 3px at 75% 15%, #A9D0E8 99%, transparent),
        radial-gradient(3px 3px at 85% 65%, #E8A6C8 99%, transparent),
        radial-gradient(2px 2px at 60% 88%, #FFFFFF 99%, transparent),
        radial-gradient(2px 2px at 92% 35%, #C1DDF0 99%, transparent);

    background-size: 550px 450px;
    opacity: 0.8;
    animation: starTwinkle 5s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes starTwinkle {
    from { opacity: 0.35; }
    to { opacity: 0.9; }
}
    
h1 {
    position: relative;
    z-index: 2;
    margin: 35px 0 0;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(13px, 2vw, 21px);
    line-height: 1.8;
}

.subtitle {
    position: relative;
    z-index: 2;
    text-align: center;
    font-size: 24px;
    margin-top: 12px;
}

.solar-system {
    position: absolute;
    width: min(76vw, 76vh);
    height: min(76vw, 76vh);
    left: 50%;
    top: 54%;
    transform: translate(-50%, -50%);
}

.orbit {
    position: absolute;
    border: 1px solid rgba(242, 217, 154, 0.22);
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.planet {
    position: absolute;
    width: 85px;
    height: 85px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
        radial-gradient(circle at 35% 30%, #E9C98A, #A96E57 55%, #493A59);
    box-shadow:
        0 0 25px rgba(226, 174, 116, 0.45),
        0 0 65px rgba(169, 110, 87, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #171323;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    text-align: center;
    line-height: 1.8;
    z-index: 2;
}

.back-button {
    position: relative;
    display: block;
    width: fit-content;
    margin: 8px auto 0;
    z-index: 3;
    color: #F2D99A;
    text-decoration: none;
    font-size: 24px;
}

.back-button:hover {
    color: #FFFFFF;
}

@media (max-width: 600px) {
    .solar-system {
        width: 82vw;
        height: 82vw;
        top: 55%;
    }

    .planet {
        width: 40px;
        height: 40px;
        font-size: 7px;
    }

    h1 {
        font-size: 12px;
    }
    .moon {
        width: 10px;
        height: 10px;
    }
    
    .moon::after {
        width: 3px;
        height: 3px;
        left: 3px;
        top: 3px;
        box-shadow:
            5px 4px 0 #9993A0,
            2px 8px 0 #A49BA3;
    }
    
    .moon-label {
        top: -23px;
        font-size: 17px;
    }
}

.moon-orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
}

.moon {
    position: absolute;
    top: 0;
    left: 50%;
    width: 25px;
    height: 25px;
    transform: translate(-50%, -50%);
    display: block;
    cursor: pointer;
    pointer-events: auto;

    background: #C5B8A0;

    clip-path: polygon(
        25% 0, 75% 0, 75% 12%,
        100% 12%, 100% 75%,
        75% 75%, 75% 100%,
        25% 100%, 25% 88%,
        0 88%, 0 25%, 25% 25%
    );

    animation: moonSpin 4s linear infinite;
}

@keyframes moonSpin {
    from { transform: translate(-50%, -50%) rotateY(0deg); }
    to { transform: translate(-50%, -50%) rotateY(360deg); }
}

.moon:hover {
    filter: brightness(1.5);
}

.moon-label {
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    color: #F2D99A;
    font-family: 'VT323', monospace;
    font-size: 22px;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    z-index: 20;
    pointer-events: none;
}

.moon-orbit:hover .moon-label {
    opacity: 1;
    visibility: visible;
}

@media (max-width: 600px) {
    .moon {
        width: 7px;
        height: 7px;
    }

    .moon::after {
        display: none;
    }

    .moon-label {
        top: -19px;
        font-size: 14px;
    }
}

/* YEAR NAVIGATION */

.year-navigation {
    position: fixed;
    top: 55%;
    left: 0;
    right: 0;
    transform: translateY(-50%);
    display: flex;
    justify-content: space-between;
    padding: 0 35px;
    z-index: 10;
    pointer-events: none;
}

.year-nav-button {
    pointer-events: auto;
    border: none;
    background: transparent;
    color: #F2D99A;
    font-family: 'VT323', monospace;
    font-size: 25px;
    cursor: pointer;
    transition: color .3s, opacity .3s;
}

.year-nav-button:hover {
    color: #FFFFFF;
}

.year-nav-button:disabled {
    opacity: .35;
    cursor: default;
    #travel-back {
    margin-right: auto;
    }
    #travel-forward {
        margin-left: auto;
    }
}

@media (max-width: 600px) {
    .year-navigation {
        padding: 0 10px;
        top: 88%;
    }

    .year-nav-button {
        font-size: 19px;
    }
}

/* FOCUS TRANSITION */

.travel-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(8, 11, 25, 0.94);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    overflow: hidden;
    transition: opacity 1.4s ease, visibility 1.4s;
}

.travel-overlay.active {
    opacity: 1;
    visibility: visible;
}

body.traveling .solar-system,
body.traveling .sky,
body.traveling .subtitle,
body.traveling .back-button,
body.traveling .year-navigation {
    filter: blur(9px);
    transition: filter 2s ease, transform 2.5s ease, opacity 2s ease;
}

body.traveling.travel-back .solar-system {
    transform: translate(calc(-50% - 35vw), -50%) scale(.92);
    opacity: .2;
}

body.traveling.travel-forward .solar-system {
    transform: translate(calc(-50% + 35vw), -50%) scale(.92);
    opacity: .2;
}

body.traveling.travel-back .sky {
    transform: translateX(-35vw) scale(.92);
    opacity: .2;
}

body.traveling.travel-forward .sky {
    transform: translateX(35vw) scale(.92);
    opacity: .2;
}

/* DESTINATION PLANET */

.travel-planet {
    position: absolute;
    left: 50%;
    top: 42%;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    opacity: 0;
    filter: blur(22px);
    transform: translate(-50%, -50%) scale(.65);
    background:
        radial-gradient(circle at 35% 30%, #E9C98A, #A96E57 55%, #493A59);
        
    box-shadow:
        0 0 25px rgba(226, 174, 116, 0.45),
        0 0 65px rgba(169, 110, 87, 0.2);
    transition:
        opacity 2s ease,
        filter 2.5s ease,
        transform 3s cubic-bezier(.2,.7,.2,1);
}

.travel-overlay.planet-visible .travel-planet {
    opacity: 1;
}

.travel-overlay.focused .travel-planet {
    filter: blur(0);
    transform: translate(-50%, -50%) scale(1);
}

.travel-overlay.zoom .travel-planet {
    transform: translate(-50%, -50%) scale(5);
    opacity: 0;
    filter: blur(3px);
}

/* FOCUS RING */

.focus-ring {
    position: absolute;
    left: 50%;
    bottom: -2px;
    width: min(340px, 80vw);
    height: 180px;
    transform: translateX(-50%) translateY(25px);
    opacity: 0;
    transition: opacity 1.5s ease, transform 1.5s ease;
}

.travel-overlay.active .focus-ring {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.focus-ring svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.focus-arc {
    fill: none;
    stroke: rgba(242, 217, 154, .35);
    stroke-width: 1;
}

.focus-tick {
    stroke: rgba(242, 217, 154, .65);
    stroke-width: 1;
}

.focus-tick.major {
    stroke: #F2D99A;
    stroke-width: 1.5;
}

.focus-indicator {
    stroke: #FFFFFF;
    stroke-width: 2;
    stroke-linecap: round;
    transform-origin: 150px 150px;
    transition: transform 2s cubic-bezier(.65, 0, .35, 1);
    filter: drop-shadow(0 0 5px rgba(255,255,255,.8));
}

.travel-overlay.zoom .focus-ring {
    opacity: 0;
    transform: translateX(-50%) translateY(20px);
}

/* ARRIVAL */

@keyframes solarArrival {
    0% {
        opacity: 0;
        filter: blur(18px);
        transform: translate(-50%, -50%) scale(1.12);
    }
    65% {
        opacity: 1;
        filter: blur(3px);
        transform: translate(-50%, -50%) scale(1.025);
    }
    100% {
        opacity: 1;
        filter: blur(0);
        transform: translate(-50%, -50%) scale(1);
    }
}

body.arriving .solar-system {
    animation: solarArrival 2.8s cubic-bezier(.2,.7,.2,1) both;
}

body.arriving .sky {
    animation: solarArrival 2.8s ease both;
}

@media (prefers-reduced-motion: reduce) {
    .travel-overlay *,
    .travel-overlay,
    body.arriving .solar-system,
    body.arriving .sky {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
    }
}

</style>
</head>

<body>

<div class="sky"></div>

<div class="subtitle">choose a moon to land on.</div>
<a class="back-button" href="index.html">← BACK</a>

<div class="year-navigation">
    <button class="year-nav-button" id="travel-back">
        ← TRAVEL BACK
    </button>

    <button class="year-nav-button" id="travel-forward">
        TRAVEL FORWARD →
    </button>
</div>

<div class="travel-overlay" id="travel-overlay">

    <div class="travel-planet"></div>

    <div class="focus-ring">
        <svg viewBox="0 0 300 160">
            <path
                class="focus-arc"
                d="M20 150 A130 130 0 0 1 280 150"
            />

            <g id="focus-ticks"></g>

            <line
                id="focus-indicator"
                class="focus-indicator"
                x1="150"
                y1="150"
                x2="150"
                y2="27"
            />
        </svg>
    </div>

</div>

<div class="solar-system">

    <div class="orbit" style="width: 19%; height: 19%;"></div>
    <div class="orbit" style="width: 27%; height: 27%;"></div>
    <div class="orbit" style="width: 35%; height: 35%;"></div>
    <div class="orbit" style="width: 43%; height: 43%;"></div>
    <div class="orbit" style="width: 51%; height: 51%;"></div>
    <div class="orbit" style="width: 59%; height: 59%;"></div>
    <div class="orbit" style="width: 67%; height: 67%;"></div>
    <div class="orbit" style="width: 75%; height: 75%;"></div>
    <div class="orbit" style="width: 83%; height: 83%;"></div>
    <div class="orbit" style="width: 91%; height: 91%;"></div>
    <div class="orbit" style="width: 99%; height: 99%;"></div>
    <div class="orbit" style="width: 107%; height: 107%;"></div>

<!-- January -->
<div class="moon-orbit" style="width:19%;height:19%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(0deg);">
    <a class="moon" href="january.html" aria-label="January"></a>
    <span class="moon-label">JAN</span>
</div>

<!-- February -->
<div class="moon-orbit" style="width:27%;height:27%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(135deg);">
    <a class="moon" href="february.html" aria-label="February"></a>
        <span class="moon-label">FEB</span>
</div>

<!-- March -->
<div class="moon-orbit" style="width:35%;height:35%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(240deg);">
    <a class="moon" href="march.html" aria-label="March"></a>
        <span class="moon-label">MAR</span>
</div>

<!-- April -->
<div class="moon-orbit" style="width:43%;height:43%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(55deg);">
    <a class="moon" href="april.html" aria-label="April"></a>
        <span class="moon-label">APR</span>
</div>

<!-- May -->
<div class="moon-orbit" style="width:51%;height:51%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(180deg);">
    <a class="moon" href="may.html" aria-label="May"></a>
        <span class="moon-label">MAY</span>
</div>

<!-- June -->
<div class="moon-orbit" style="width:59%;height:59%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(300deg);">
    <a class="moon" href="june.html" aria-label="June"></a>
        <span class="moon-label">JUN</span>
</div>

<!-- July -->
<div class="moon-orbit" style="width:67%;height:67%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(110deg);">
    <a class="moon" href="july.html" aria-label="July"></a>
        <span class="moon-label">JUL</span>
</div>

<!-- August -->
<div class="moon-orbit" style="width:75%;height:75%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(220deg);">
    <a class="moon" href="august.html" aria-label="August"></a>
        <span class="moon-label">AUG</span>
</div>

<!-- September -->
<div class="moon-orbit" style="width:83%;height:83%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(350deg);">
    <a class="moon" href="september.html" aria-label="September"></a>
        <span class="moon-label">SEP</span>
</div>

<!-- October -->
<div class="moon-orbit" style="width:91%;height:91%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(155deg);">
    <a class="moon" href="october.html" aria-label="October"></a>
        <span class="moon-label">OCT</span>
</div>

<!-- November -->
<div class="moon-orbit" style="width:99%;height:99%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(265deg);">
    <a class="moon" href="november.html" aria-label="November"></a>
        <span class="moon-label">NOV</span>
</div>

<!-- December -->
<div class="moon-orbit" style="width:107%;height:107%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(35deg);">
    <a class="moon" href="december.html" aria-label="December"></a>
        <span class="moon-label">DEC</span>
</div>

    <div class="planet">2027</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const currentYear = Number(params.get("year")) || 2027;

// Display the selected year.
document.querySelector(".planet").textContent = currentYear;

// Carry the selected year into the monthly pages.
document.querySelectorAll(".moon").forEach(moon => {
    const url = new URL(moon.href);
    url.searchParams.set("year", currentYear);
    moon.href = url.toString();
});

// Focus ring elements.
const overlay = document.getElementById("travel-overlay");
const indicator = document.getElementById("focus-indicator");
const ticks = document.getElementById("focus-ticks");

const backButton = document.getElementById("travel-back");
const forwardButton = document.getElementById("travel-forward");
// Only allow travel between 2026 and 2027.
backButton.style.display = currentYear === 2027 ? "block" : "none";
forwardButton.style.display = currentYear === 2026 ? "block" : "none";

let travelling = false;

// Draw the focus ring's tick marks.
for (let i = 0; i <= 24; i++) {
    const angle = Math.PI + (Math.PI * i / 24);
    const major = i % 4 === 0;

    const outerRadius = 128;
    const innerRadius = major ? 114 : 120;

    const x1 = 150 + Math.cos(angle) * innerRadius;
    const y1 = 150 + Math.sin(angle) * innerRadius;

    const x2 = 150 + Math.cos(angle) * outerRadius;
    const y2 = 150 + Math.sin(angle) * outerRadius;

    const tick = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
    );

    tick.setAttribute("x1", x1);
    tick.setAttribute("y1", y1);
    tick.setAttribute("x2", x2);
    tick.setAttribute("y2", y2);
    tick.setAttribute("class", major ? "focus-tick major" : "focus-tick");

    ticks.appendChild(tick);
}

// Travel between years.
function travelToYear(direction) {
    if (travelling) return;
    if (
        (direction === -1 && currentYear !== 2027) ||
        (direction === 1 && currentYear !== 2026)
    ) return;

    travelling = true;

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        window.location.href =
            `soundspace.html?year=${currentYear + direction}`;
        return;
    }

    document.body.classList.add("traveling");
    overlay.classList.add("active");

    // 1. Defocus: sweep the indicator.
    setTimeout(() => {
        indicator.style.transform =
            `rotate(${direction * 70}deg)`;
    }, 250);

    // 2. Travel in the selected direction.
    setTimeout(() => {
        document.body.classList.add(
            direction < 0 ? "travel-back" : "travel-forward"
        );
    }, 2600);

    // 3. Reveal the destination planet, still blurred.
    setTimeout(() => {
        overlay.classList.add("planet-visible");
    }, 4300);

    // 4. Refocus: return the indicator to centre.
    setTimeout(() => {
        indicator.style.transform = "rotate(0deg)";
    }, 4800);

    setTimeout(() => {
        overlay.classList.add("focused");
    }, 5900);

    // 5. Gradually zoom into the destination.
    setTimeout(() => {
        overlay.classList.add("zoom");
    }, 8500);

    // 6. Arrive at the destination year's page.
    setTimeout(() => {
        window.location.href =
            `soundspace.html?year=${currentYear + direction}&arrive=1`;
    }, 10300);
}

backButton.addEventListener("click", () => travelToYear(-1));
forwardButton.addEventListener("click", () => travelToYear(1));

// Smoothly reveal the actual destination solar system.
if (params.get("arrive") === "1") {
    document.body.classList.add("arriving");

    setTimeout(() => {
        document.body.classList.remove("arriving");

        const cleanUrl =
            `soundspace.html?year=${currentYear}`;

        window.history.replaceState(null, "", cleanUrl);
    }, 3000);
}
</script>
