<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #080B19;
    color: #F2D99A;
    font-family: 'VT323', monospace;
    overflow-x: hidden;
}

.sky {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(2px 2px at 100px 120px, #F2D99A, transparent),
        radial-gradient(1px 1px at 200px 80px, #fff, transparent);
    background-size: 350px 250px;
    animation: drift 120s linear infinite;
}

@keyframes drift {
    to { background-position: 350px 250px; }
}

header {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 30px 15px 15px;
}

h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(13px, 2.5vw, 22px);
    line-height: 1.8;
    margin: 0 0 12px;
}

.subtitle {
    font-size: 24px;
}

.back-button {
    display: inline-block;
    margin-top: 10px;
    color: #F2D99A;
    text-decoration: none;
    font-size: 22px;
}

main {
    position: relative;
    z-index: 2;
    width: min(900px, 94%);
    margin: 15px auto 40px;
    padding: 20px;
    background: rgba(16, 20, 43, 0.72);
    border: 1px solid rgba(242, 217, 154, 0.25);
}

.month-heading {
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(12px, 2vw, 18px);
    margin: 10px 0 25px;
}

.weekdays, .calendar {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 12px;
    text-align: center;
}

.weekdays {
    margin-bottom: 15px;
    font-size: 21px;
    color: #B7A9D5;
}

.day {
    min-height: 85px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 20px;
}

/* MOON BASE */
.moon {
    position:relative;
    width:38px;
    height:38px;
    display:block;
    border-radius:50%;
    overflow:hidden;
    background:#DCCBA8;
    border:2px solid #F2D99A;
    box-shadow:0 0 12px rgba(242,217,154,.35);
    image-rendering:pixelated;
}

.moon::before {
    content:"";
    position:absolute;
    inset:0;
    z-index:2;
    background:#34344D;
}

.moon::after {
    display:none;
}

/* NEW MOON */
.phase-0 {
    background:#34344D;
}
.phase-0::before {
    display:none;
}

/* WAXING CRESCENT — illuminated on right */
.phase-1::before {
    clip-path:polygon(
        0 0,100% 0,
        100% 10%,94% 10%,
        94% 20%,88% 20%,
        88% 30%,82% 30%,
        82% 40%,78% 40%,
        78% 50%,78% 60%,
        82% 60%,82% 70%,
        88% 70%,88% 80%,
        94% 80%,94% 90%,
        100% 90%,100% 100%,
        0 100%
    );
}

/* FIRST QUARTER — illuminated on right */
.phase-2::before {
    clip-path:inset(0 50% 0 0);
}

.phase-3::before {
    clip-path:polygon(
        0 0,42% 0,
        38% 10%,32% 10%,
        32% 20%,26% 20%,
        26% 30%,22% 30%,
        22% 40%,20% 40%,
        20% 60%,22% 60%,
        22% 70%,26% 70%,
        26% 80%,32% 80%,
        32% 90%,38% 90%,
        42% 100%,0 100%
    );
}

/* FULL MOON */
.phase-4 {
    background:#DCCBA8;
}
.phase-4::before {
    display:none;
}

.phase-5::before {
    clip-path:polygon(
        58% 0,100% 0,
        100% 100%,58% 100%,
        62% 90%,68% 90%,
        68% 80%,74% 80%,
        74% 70%,78% 70%,
        78% 60%,80% 60%,
        80% 40%,78% 40%,
        78% 30%,74% 30%,
        74% 20%,68% 20%,
        68% 10%,62% 10%
    );
}

/* THIRD QUARTER — illuminated on left */
.phase-6::before {
    clip-path:inset(0 0 0 50%);
}

/* WANING CRESCENT — illuminated on left */
.phase-7::before {
    clip-path:polygon(
        0 0,100% 0,
        100% 100%,0 100%,
        0 90%,6% 90%,
        6% 80%,12% 80%,
        12% 70%,18% 70%,
        18% 60%,22% 60%,
        22% 50%,22% 40%,
        18% 40%,18% 30%,
        12% 30%,12% 20%,
        6% 20%,6% 10%,
        0 10%
    );
}

/* COMPLETED DAYS */
.day.completed .moon {
    box-shadow:0 0 15px rgba(242,217,154,.65);
}

/* NO MUSIC — DARK OUTLINE */
.day.no-music .moon {
    outline:2px solid #080B19;
    outline-offset:3px;
}

.day.today .moon {
    outline: 2px solid #E9A6C8;
    outline-offset: 5px;
}

.day.future {
    opacity: 0.22;
}

.day.future .moon {
    cursor: not-allowed;
    box-shadow: none;
}

.day.empty {
    visibility: hidden;
}

.playlist {
    display: block;
    width: fit-content;
    margin: 30px auto 5px;
    padding: 12px 20px;
    border: 2px solid #F2D99A;
    color: #F2D99A;
    background: transparent;
    font-family: 'VT323', monospace;
    font-size: 22px;
    cursor: not-allowed;
    opacity: 0.45;
}

.legend {

    gap: 20px;
    margin-top: 25px;
    font-size: 19px;
}

.legend span {

}

.legend-dot {

    background: #F2D99A;
    display: inline-block;
}

.legend-dot.future-dot { opacity: 0.25; }
.legend-dot.today-dot { background: #E9A6C8; }

    </div>

<script>
const year = 2027;
const month = 2; // March (January = 0)
const daysInMonth = new Date(year, month + 1, 0).getDate();
const firstDay = new Date(year, month, 1).getDay();
const today = 6; // Temporary sample date

const calendar = document.getElementById("calendar");

// Empty spaces before January 1
for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    calendar.appendChild(empty);
}

function getMoonPhase(day) {
    const date = new Date(Date.UTC(year, month, day, 12));

    const julianDate = date.getTime() / 86400000 + 2440587.5;

    const lunarCycle = 29.530588853;
    const referenceNewMoon = 2451550.1;

    const age = (
        (julianDate - referenceNewMoon) % lunarCycle
        + lunarCycle
    ) % lunarCycle;

    const progress = age / lunarCycle;

    if (progress < 0.03 || progress >= 0.97) return 0;
    if (progress < 0.22) return 1;
    if (progress < 0.28) return 2;
    if (progress < 0.47) return 3;
    if (progress < 0.53) return 4;
    if (progress < 0.72) return 5;
    if (progress < 0.78) return 6;

    return 7;
}

// Sample daily entries
for (let day = 1; day <= daysInMonth; day++) {
    const cell = document.createElement("div");
    cell.className = "day";

    if (day < today) {
        cell.classList.add(day === 3 ? "no-music" : "completed");
    } else if (day === today) {
        cell.classList.add("today");
    } else {
        cell.classList.add("future");
    }

    const phase = getMoonPhase(day);
    
    cell.innerHTML = `
        <span>${day}</span>
        <div class="moon phase-${phase}"></div>
    `;

    if (day <= today) {
        cell.style.cursor = "pointer";
        cell.addEventListener("click", () => {
            window.location.href = `entry.html?date=${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        });
    }

    calendar.appendChild(cell);
}
</script>
