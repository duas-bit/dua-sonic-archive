
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sai's Sonic Archive | The SoundSpace</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    background: #080B19;
    color: #F2D99A;
    font-family: 'VT323', monospace;
}

.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background-color: #080B19;

    background-image:
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(2px 2px at 100px 120px, #F2D99A, transparent),
        radial-gradient(1px 1px at 200px 80px, #fff, transparent),
        radial-gradient(2px 2px at 300px 200px, #fff, transparent),
        radial-gradient(3px 3px at 75px 180px, #C9B7F0, transparent),
        radial-gradient(2px 2px at 250px 65px, #A9D0E8, transparent),
        radial-gradient(2px 2px at 180px 220px, #E8A6C8, transparent);

    background-size: 350px 250px;
    animation: drift 120s linear infinite;
}

@keyframes drift {
    from { background-position: 0 0; }
    to { background-position: 350px 250px; }
}
    
.sky::before {
    content: "";
    position: absolute;
    inset: -10%;

    background:
        radial-gradient(ellipse at 18% 30%,
            rgba(119, 97, 168, 0.32), transparent 35%),

        radial-gradient(ellipse at 78% 22%,
            rgba(83, 111, 168, 0.28), transparent 38%),

        radial-gradient(ellipse at 52% 75%,
            rgba(164, 95, 134, 0.25), transparent 36%),

        radial-gradient(ellipse at 92% 70%,
            rgba(193, 138, 101, 0.19), transparent 30%),

        radial-gradient(ellipse at 12% 85%,
            rgba(100, 142, 170, 0.22), transparent 32%);

    filter: blur(45px);
    pointer-events: none;
}

.sky::after {
    content: "";
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(3px 3px at 15% 20%, #FFF4D2 99%, transparent),
        radial-gradient(4px 4px at 38% 42%, #C9B7F0 99%, transparent),
        radial-gradient(3px 3px at 75% 15%, #A9D0E8 99%, transparent),
        radial-gradient(3px 3px at 85% 65%, #E8A6C8 99%, transparent),
        radial-gradient(2px 2px at 60% 88%, #FFFFFF 99%, transparent),
        radial-gradient(2px 2px at 92% 35%, #C1DDF0 99%, transparent);

    background-size: 550px 450px;
    opacity: 0.8;
    animation: starTwinkle 5s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes starTwinkle {
    from { opacity: 0.35; }
    to { opacity: 0.9; }
}
    
h1 {
    position: relative;
    z-index: 2;
    margin: 35px 0 0;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(13px, 2vw, 21px);
    line-height: 1.8;
}

.subtitle {
    position: relative;
    z-index: 2;
    text-align: center;
    font-size: 24px;
    margin-top: 12px;
}

.solar-system {
    position: absolute;
    width: min(76vw, 76vh);
    height: min(76vw, 76vh);
    left: 50%;
    top: 54%;
    transform: translate(-50%, -50%);
}

.orbit {
    position: absolute;
    border: 1px solid rgba(242, 217, 154, 0.22);
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.planet {
    position: absolute;
    width: 85px;
    height: 85px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
        radial-gradient(circle at 35% 30%, #E9C98A, #A96E57 55%, #493A59);
    box-shadow:
        0 0 25px rgba(226, 174, 116, 0.45),
        0 0 65px rgba(169, 110, 87, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #171323;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    text-align: center;
    line-height: 1.8;
    z-index: 2;
}

.back-button {
    position: relative;
    display: block;
    width: fit-content;
    margin: 8px auto 0;
    z-index: 3;
    color: #F2D99A;
    text-decoration: none;
    font-size: 24px;
}

.back-button:hover {
    color: #FFFFFF;
}

@media (max-width: 600px) {
    .solar-system {
        width: 82vw;
        height: 82vw;
        top: 55%;
    }

    .planet {
        width: 40px;
        height: 40px;
        font-size: 7px;
    }

    h1 {
        font-size: 12px;
    }
    .moon {
        width: 10px;
        height: 10px;
    }
    
    .moon::after {
        width: 3px;
        height: 3px;
        left: 3px;
        top: 3px;
        box-shadow:
            5px 4px 0 #9993A0,
            2px 8px 0 #A49BA3;
    }
    
    .moon-label {
        top: -23px;
        font-size: 17px;
    }
}

.moon-orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
}

.moon {
    position: absolute;
    top: 0;
    left: 50%;
    width: 25px;
    height: 25px;
    transform: translate(-50%, -50%);
    display: block;
    cursor: pointer;
    pointer-events: auto;

    background: #C5B8A0;

    clip-path: polygon(
        25% 0, 75% 0, 75% 12%,
        100% 12%, 100% 75%,
        75% 75%, 75% 100%,
        25% 100%, 25% 88%,
        0 88%, 0 25%, 25% 25%
    );

    animation: moonSpin 4s linear infinite;
}

@keyframes moonSpin {
    from { transform: translate(-50%, -50%) rotateY(0deg); }
    to { transform: translate(-50%, -50%) rotateY(360deg); }
}

.moon:hover {
    filter: brightness(1.5);
}

.moon-label {
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    color: #F2D99A;
    font-family: 'VT323', monospace;
    font-size: 22px;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    z-index: 20;
    pointer-events: none;
}

.moon-orbit:hover .moon-label {
    opacity: 1;
    visibility: visible;
}

@media (max-width: 600px) {
    .moon {
        width: 7px;
        height: 7px;
    }

    .moon::after {
        display: none;
    }

    .moon-label {
        top: -19px;
        font-size: 14px;
    }
}


/* YEAR NAVIGATION */

.year-navigation {
    position: fixed;
    top: 55%;
    left: 0;
    right: 0;
    transform: translateY(-50%);
    display: flex;
    justify-content: space-between;
    padding: 0 35px;
    z-index: 10;
    pointer-events: none;
}

.year-nav-button {
    pointer-events: auto;
    border: none;
    background: transparent;
    color: #F2D99A;
    font-family: 'VT323', monospace;
    font-size: 25px;
    cursor: pointer;
    transition: color .3s, opacity .3s;
}

.year-nav-button:hover {
    color: #FFFFFF;
}

.year-nav-button:disabled {
    opacity: .35;
    cursor: default;
}

@media (max-width: 600px) {
    .year-navigation {
        padding: 0 10px;
        top: 88%;
    }

    .year-nav-button {
        font-size: 19px;
    }
}

/* TELESCOPE TRANSITION */

.travel-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #080B19;
    opacity: 0;
    visibility: hidden;
    overflow: hidden;
    transition: opacity .5s ease, visibility .5s;
}

.travel-overlay.active {
    opacity: 1;
    visibility: visible;
}

body.traveling .sky,
body.traveling .subtitle,
body.traveling .back-button,
body.traveling .solar-system,
body.traveling .year-navigation {
    filter: blur(8px);
    transition: filter .6s ease;
}

.travel-planet {
    position: absolute;
    width: 190px;
    height: 190px;
    left: 50%;
    top: 43%;
    transform: translate(-50%, -50%) scale(.65);
    border-radius: 50%;
    opacity: 0;
    filter: blur(18px);
    background: radial-gradient(circle at 35% 30%, #E9C98A, #A96E57 55%, #493A59);
    box-shadow: 0 0 70px rgba(226,174,116,.4);
    transition: opacity .6s, filter .7s, transform 1s;
}

.travel-overlay.planet-visible .travel-planet {
    opacity: 1;
}

.travel-overlay.focused .travel-planet {
    filter: blur(0);
    transform: translate(-50%, -50%) scale(1);
}

.travel-overlay.zoom .travel-planet {
    transform: translate(-50%, -50%) scale(5);
    opacity: .8;
}

/* TELESCOPE */

.telescope {
    position: absolute;
    left: 50%;
    bottom: 13%;
    width: 230px;
    height: 90px;
    transform: translateX(-50%);
    transition: transform .8s cubic-bezier(.65,0,.35,1);
}

.telescope-barrel {
    position: absolute;
    width: 190px;
    height: 48px;
    left: 20px;
    top: 8px;
    border-radius: 8px 20px 20px 8px;
    background: linear-gradient(180deg, #77758A, #292B42 45%, #111426);
    border: 2px solid #B7A9D5;
    box-shadow: 0 0 20px rgba(183,169,213,.2);
}

.telescope-lens {
    position: absolute;
    right: -8px;
    top: 3px;
    width: 22px;
    height: 58px;
    border-radius: 5px;
    background: linear-gradient(90deg, #D6BD79, #77758A, #25283D);
    border: 2px solid #D6BD79;
}

.telescope-eyepiece {
    position: absolute;
    left: 0;
    top: 17px;
    width: 28px;
    height: 30px;
    border-radius: 5px;
    background: #77758A;
    border: 2px solid #B7A9D5;
}

.telescope-tripod {
    position: absolute;
    width: 5px;
    height: 65px;
    left: 112px;
    top: 52px;
    background: #77758A;
    transform: rotate(4deg);
}

.travel-overlay.move-back .telescope {
    transform: translateX(calc(-50% - 35vw)) rotate(-7deg);
}

.travel-overlay.move-forward .telescope {
    transform: translateX(calc(-50% + 35vw)) rotate(7deg);
}

.travel-overlay.zoom .telescope {
    transform: translateX(-50%) scale(2.5);
    opacity: 0;
}

@media (prefers-reduced-motion: reduce) {
    .travel-overlay,
    .travel-planet,
    .telescope,
    .travel-planet {
        transition-duration: .01ms !important;
    }
}

</style>
</head>

<body>

<div class="sky"></div>

<div class="subtitle">choose a moon to land on.</div>
<a class="back-button" href="index.html">← BACK</a>

<div class="year-navigation">
    <button class="year-nav-button" id="travel-back">
        ← TRAVEL BACK
    </button>

    <button class="year-nav-button" id="travel-forward">
        TRAVEL FORWARD →
    </button>
</div>

<div class="travel-overlay" id="travel-overlay">
    <div class="travel-planet"></div>

    <div class="telescope">
        <div class="telescope-barrel"></div>
        <div class="telescope-lens"></div>
        <div class="telescope-eyepiece"></div>
        <div class="telescope-tripod"></div>
    </div>
</div>


<div class="solar-system">

    <div class="orbit" style="width: 19%; height: 19%;"></div>
    <div class="orbit" style="width: 27%; height: 27%;"></div>
    <div class="orbit" style="width: 35%; height: 35%;"></div>
    <div class="orbit" style="width: 43%; height: 43%;"></div>
    <div class="orbit" style="width: 51%; height: 51%;"></div>
    <div class="orbit" style="width: 59%; height: 59%;"></div>
    <div class="orbit" style="width: 67%; height: 67%;"></div>
    <div class="orbit" style="width: 75%; height: 75%;"></div>
    <div class="orbit" style="width: 83%; height: 83%;"></div>
    <div class="orbit" style="width: 91%; height: 91%;"></div>
    <div class="orbit" style="width: 99%; height: 99%;"></div>
    <div class="orbit" style="width: 107%; height: 107%;"></div>

<!-- January -->
<div class="moon-orbit" style="width:19%;height:19%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(0deg);">
    <a class="moon" href="january.html" aria-label="January"></a>
    <span class="moon-label">JAN</span>
</div>

<!-- February -->
<div class="moon-orbit" style="width:27%;height:27%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(135deg);">
    <a class="moon" href="february.html" aria-label="February"></a>
        <span class="moon-label">FEB</span>
</div>

<!-- March -->
<div class="moon-orbit" style="width:35%;height:35%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(240deg);">
    <a class="moon" href="march.html" aria-label="March"></a>
        <span class="moon-label">MAR</span>
</div>

<!-- April -->
<div class="moon-orbit" style="width:43%;height:43%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(55deg);">
    <a class="moon" href="april.html" aria-label="April"></a>
        <span class="moon-label">APR</span>
</div>

<!-- May -->
<div class="moon-orbit" style="width:51%;height:51%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(180deg);">
    <a class="moon" href="may.html" aria-label="May"></a>
        <span class="moon-label">MAY</span>
</div>

<!-- June -->
<div class="moon-orbit" style="width:59%;height:59%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(300deg);">
    <a class="moon" href="june.html" aria-label="June"></a>
        <span class="moon-label">JUN</span>
</div>

<!-- July -->
<div class="moon-orbit" style="width:67%;height:67%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(110deg);">
    <a class="moon" href="july.html" aria-label="July"></a>
        <span class="moon-label">JUL</span>
</div>

<!-- August -->
<div class="moon-orbit" style="width:75%;height:75%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(220deg);">
    <a class="moon" href="august.html" aria-label="August"></a>
        <span class="moon-label">AUG</span>
</div>

<!-- September -->
<div class="moon-orbit" style="width:83%;height:83%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(350deg);">
    <a class="moon" href="september.html" aria-label="September"></a>
        <span class="moon-label">SEP</span>
</div>

<!-- October -->
<div class="moon-orbit" style="width:91%;height:91%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(155deg);">
    <a class="moon" href="october.html" aria-label="October"></a>
        <span class="moon-label">OCT</span>
</div>

<!-- November -->
<div class="moon-orbit" style="width:99%;height:99%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(265deg);">
    <a class="moon" href="november.html" aria-label="November"></a>
        <span class="moon-label">NOV</span>
</div>

<!-- December -->
<div class="moon-orbit" style="width:107%;height:107%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(35deg);">
    <a class="moon" href="december.html" aria-label="December"></a>
        <span class="moon-label">DEC</span>
</div>

    <div class="planet">2027</div>

</div>


<script>
const params = new URLSearchParams(window.location.search);
const currentYear = Number(params.get("year")) || 2027;

document.querySelector(".planet").textContent = currentYear;

// Carry the selected year into the monthly pages.
document.querySelectorAll(".moon").forEach(moon => {
    const url = new URL(moon.href);
    url.searchParams.set("year", currentYear);
    moon.href = url.toString();
});

const overlay = document.getElementById("travel-overlay");
const backButton = document.getElementById("travel-back");
const forwardButton = document.getElementById("travel-forward");

let travelling = false;

function travelToYear(direction) {
    if (travelling) return;

    travelling = true;

    const destinationYear = currentYear + direction;

    document.body.classList.add("traveling");
    overlay.classList.add("active");

    // Move the telescope in the chosen direction.
    setTimeout(() => {
        overlay.classList.add(
            direction < 0 ? "move-back" : "move-forward"
        );
    }, 450);

    // Reveal the destination planet, initially out of focus.
    setTimeout(() => {
        overlay.classList.add("planet-visible");
    }, 1150);

    // Focus the telescope lens.
    setTimeout(() => {
        overlay.classList.add("focused");
    }, 1750);

    // Zoom into the destination.
    setTimeout(() => {
        overlay.classList.add("zoom");
    }, 2450);

    // Arrive at the new year's solar system.
    setTimeout(() => {
        window.location.href =
            `solar-system.html?year=${destinationYear}`;
    }, 3300);
}

backButton.addEventListener("click", () => {
    travelToYear(-1);
});

forwardButton.addEventListener("click", () => {
    travelToYear(1);
});
</script>

</body>
</html>
