
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sai's Sonic Archive | Solar System</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    background: #080B19;
    color: #F2D99A;
    font-family: 'VT323', monospace;
}

.sky {
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(2px 2px at 100px 120px, #F2D99A, transparent),
        radial-gradient(1px 1px at 200px 80px, #fff, transparent),
        radial-gradient(2px 2px at 300px 200px, #fff, transparent);
    background-size: 350px 250px;
    animation: drift 120s linear infinite;
}

@keyframes drift {
    from { background-position: 0 0; }
    to { background-position: 350px 250px; }
}

h1 {
    position: relative;
    z-index: 2;
    margin: 35px 0 0;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(13px, 2vw, 21px);
    line-height: 1.8;
}

.subtitle {
    position: relative;
    z-index: 2;
    text-align: center;
    font-size: 24px;
    margin-top: 12px;
}

.solar-system {
    position: absolute;
    width: min(76vw, 76vh);
    height: min(76vw, 76vh);
    left: 50%;
    top: 54%;
    transform: translate(-50%, -50%);
}

.orbit {
    position: absolute;
    border: 1px solid rgba(242, 217, 154, 0.22);
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.planet {
    position: absolute;
    width: 105px;
    height: 105px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
        radial-gradient(circle at 35% 30%, #E9C98A, #A96E57 55%, #493A59);
    box-shadow:
        0 0 25px rgba(226, 174, 116, 0.45),
        0 0 65px rgba(169, 110, 87, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #171323;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    text-align: center;
    line-height: 1.8;
    z-index: 2;
}

.back-button {
    position: relative;
    display: block;
    width: fit-content;
    margin: 8px auto 0;
    z-index: 3;
    color: #F2D99A;
    text-decoration: none;
    font-size: 24px;
}

.back-button:hover {
    color: #FFFFFF;
}

@media (max-width: 600px) {
    .solar-system {
        width: 82vw;
        height: 82vw;
        top: 55%;
    }

    .planet {
        width: 75px;
        height: 75px;
        font-size: 9px;
    }

    h1 {
        font-size: 12px;
    }
}

.moon-orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
}

.moon {
    position: absolute;
    top: 0;
    left: 50%;
    width: 25px;
    height: 25px;
    transform: translate(-50%, -50%);
    display: block;
    cursor: pointer;
    pointer-events: auto;

    background: #C5B8A0;

    clip-path: polygon(
        25% 0, 75% 0, 75% 12%,
        100% 12%, 100% 75%,
        75% 75%, 75% 100%,
        25% 100%, 25% 88%,
        0 88%, 0 25%, 25% 25%
    );

    animation: moonSpin 4s linear infinite;
}

@keyframes moonSpin {
    from { transform: translate(-50%, -50%) rotateY(0deg); }
    to { transform: translate(-50%, -50%) rotateY(360deg); }
}

.moon:hover {
    filter: brightness(1.5);
}

.moon-label {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: #F2D99A;
    font-size: 19px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
}

.moon:hover .moon-label {
    opacity: 1;
}
</style>
</head>
