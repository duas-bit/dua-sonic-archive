
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sai's Sonic Archive | Daily Log</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080B19;
    color: #F2D99A;
    font-family: 'VT323', monospace;
    overflow-x: hidden;
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background-image:
        radial-gradient(2px 2px at 20% 30%, #fff, transparent),
        radial-gradient(2px 2px at 70% 60%, #B7A9D5, transparent),
        radial-gradient(1px 1px at 40% 80%, #fff, transparent),
        radial-gradient(2px 2px at 85% 20%, #F2D99A, transparent);
    background-size: 250px 250px;
    animation: starDrift 60s linear infinite;
}

@keyframes starDrift {
    from { transform: translateY(0); }
    to { transform: translateY(-250px); }
}

.page {
    width: min(100% - 40px, 900px);
    margin: 0 auto;
    padding: 55px 0 80px;
    text-align: center;
}

.back-link {
    display: inline-block;
    margin-bottom: 35px;
    color: #B7A9D5;
    text-decoration: none;
    font-size: 22px;
}

.back-link:hover {
    color: #F2D99A;
}

h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(17px, 3vw, 27px);
    line-height: 1.8;
    margin: 0 0 15px;
}

.subtitle {
    font-size: 25px;
    color: #B7A9D5;
    margin-bottom: 45px;
}

.date-details {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 50px;
}

.entry-moon {
    position: relative;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    overflow: hidden;
    background: #DCCBA8;
    border: 3px solid #F2D99A;
    box-shadow: 0 0 20px rgba(242,217,154,.3);
    image-rendering: pixelated;
}

.entry-moon::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    background: #34344D;
}

.entry-moon.phase-0::before,
.entry-moon.phase-4::before {
    display: none;
}

/* NEW MOON */
.entry-moon.phase-0 {
    background:#34344D;
}
.entry-moon.phase-0::before {
    display:none;
}

/* WAXING CRESCENT — illuminated on right */
.entry-moon.phase-1::before {
    clip-path:polygon(
        0 0,100% 0,
        100% 10%,94% 10%,
        94% 20%,88% 20%,
        88% 30%,82% 30%,
        82% 40%,78% 40%,
        78% 50%,78% 60%,
        82% 60%,82% 70%,
        88% 70%,88% 80%,
        94% 80%,94% 90%,
        100% 90%,100% 100%,
        0 100%
    );
}

/* FIRST QUARTER — illuminated on right */
.entry-moon.phase-2::before {
    clip-path:inset(0 50% 0 0);
}

.entry-moon.phase-3::before {
    clip-path:polygon(
        0 0,42% 0,
        38% 10%,32% 10%,
        32% 20%,26% 20%,
        26% 30%,22% 30%,
        22% 40%,20% 40%,
        20% 60%,22% 60%,
        22% 70%,26% 70%,
        26% 80%,32% 80%,
        32% 90%,38% 90%,
        42% 100%,0 100%
    );
}

/* FULL MOON */
.entry-moon.phase-4 {
    background:#DCCBA8;
}
.entry-moon.phase-4::before {
    display:none;
}

.entry-moon.phase-5::before {
    clip-path:polygon(
        58% 0,100% 0,
        100% 100%,58% 100%,
        62% 90%,68% 90%,
        68% 80%,74% 80%,
        74% 70%,78% 70%,
        78% 60%,80% 60%,
        80% 40%,78% 40%,
        78% 30%,74% 30%,
        74% 20%,68% 20%,
        68% 10%,62% 10%
    );
}

/* THIRD QUARTER — illuminated on left */
.entry-moon.phase-6::before {
    clip-path:inset(0 0 0 50%);
}

/* WANING CRESCENT — illuminated on left */
.entry-moon.phase-7::before {
    clip-path:polygon(
        0 0,100% 0,
        100% 100%,0 100%,
        0 90%,6% 90%,
        6% 80%,12% 80%,
        12% 70%,18% 70%,
        18% 60%,22% 60%,
        22% 50%,22% 40%,
        18% 40%,18% 30%,
        12% 30%,12% 20%,
        6% 20%,6% 10%,
        0 10%
    );
}

.phase-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #B7A9D5;
}

.soundtrack-section {
    margin: 55px auto;
    width: 100%;
}

.section-heading {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    margin-bottom: 25px;
    color: #F2D99A;
}

.song-card {
    border: 2px solid #B7A9D5;
    background: rgba(183,169,213,.07);
    padding: 25px;
    display: flex;
    align-items: center;
    gap: 25px;
    flex-wrap: wrap;
    text-align: left;
}

.album-art {
    width: 130px;
    height: 130px;
    flex-shrink: 0;
    background: #34344D;
    border: 2px solid #F2D99A;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 65px;
    color: #F2D99A;
}

.song-info {
    flex: 1;
    min-width: 130px;
}

.song-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    line-height: 2;
    color: #F2D99A;
}

.song-artist {
    font-size: 25px;
    color: #FFFFFF;
}

.song-album {
    font-size: 20px;
    color: #B7A9D5;
}

.play-count {
    text-align: center;
}

.play-number {
    display: block;
    font-size: 35px;
    color: #F2D99A;
}

.play-label {
    font-size: 16px;
    color: #B7A9D5;
}

.spotify-link {
    display: inline-block;
    width: 100%;
    text-align: center;
    padding: 13px;
    border: none;
    background: transparent;
    color: #A8D5A2;
    text-decoration: none;
    font-size: 21px;
    font-family: 'VT323', monospace;
}

.spotify-link:hover {
    color: #F2D99A;
}

.listening-stats {
    margin: 65px auto;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.stat-card {
    padding: 25px 10px;
    border: 1px solid #B7A9D5;
    background: rgba(183,169,213,.06);
}

.stat-value {
    font-family: 'Press Start 2P', monospace;
    font-size: 19px;
    color: #F2D99A;
    margin-bottom: 18px;
}

.stat-label {
    font-size: 19px;
    color: #B7A9D5;
}

.notes-section {
    margin: 65px auto 30px;
    text-align: left;
}

.notes-description {
    font-size: 22px;
    color: #B7A9D5;
    margin-bottom: 20px;
}

#daily-notes {
    width: 100%;
    min-height: 200px;
    resize: vertical;
    padding: 22px;
    background: rgba(183,169,213,.06);
    border: 2px solid #B7A9D5;
    color: #F2D99A;
    font-family: 'VT323', monospace;
    font-size: 23px;
    line-height: 1.5;
    outline: none;
}

#daily-notes:focus {
    border-color: #F2D99A;
}

#daily-notes::placeholder {
    color: #81799B;
}

.notes-footer {
    margin-top: 12px;
    text-align: right;
    font-size: 16px;
    color: #81799B;
}

.save-area {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
    margin-top: 18px;
}

#save-notes {
    background: transparent;
    border: none;
    color: #A8D5A2;
    font-family: 'VT323', monospace;
    font-size: 22px;
    cursor: pointer;
    padding: 10px 0;
}

#save-notes:hover {
    color: #F2D99A;
}

#save-status {
    color: #B7A9D5;
    font-size: 17px;
}

@media(max-width:600px) {
    .save-area {
        flex-direction: column;
        align-items: stretch;
    }

    #save-notes {
        width: 100%;
        padding: 16px 10px;
    }

    #save-status {
        text-align: center;
    }
}

@media(max-width:600px) {
    .stats-grid {
        grid-template-columns: 1fr;
    }

    .stat-card {
        padding: 18px;
    }
}

@media(max-width:600px) {
    .page {
        width: calc(100% - 28px);
        padding-top: 35px;
    }
}
</style>
</head>

<body>

<div class="stars"></div>

<main class="page">

    <a href="#" class="back-link" id="back-link">← BACK</a>

    <h1 id="entry-date">JANUARY 01, 2027</h1>
    <div class="subtitle">the song you orbitted around all day.</div>
    
    <div class="date-details">
        <div class="entry-moon phase-0" id="entry-moon"></div>
        <div class="phase-name" id="phase-name">NEW MOON</div>
    </div>

<section class="soundtrack-section">

    <div class="section-heading">TODAY'S SOUNDTRACK</div>

    <div class="song-card">

        <div class="album-art">
            <span>♫</span>
        </div>

        <div class="song-info">
            <div class="song-title" id="song-title">SONG TITLE</div>
            <div class="song-artist" id="song-artist">Artist Name</div>
            <div class="song-album" id="song-album">Album Name</div>
        </div>

        <div class="play-count">
            <span class="play-number" id="play-count">00</span>
            <span class="play-label">PLAYS</span>
        </div>

        <a href="#" class="spotify-link" id="spotify-link" target="_blank" rel="noopener">
            ▶︎ OPEN IN SPOTIFY
        </a>

    </div>

</section>
<section class="listening-stats">

    <div class="section-heading">OBSERVATION NOTES</div>

    <div class="stats-grid">

        <div class="stat-card">
            <div class="stat-value" id="total-plays">00</div>
            <div class="stat-label">TOTAL PLAYS</div>
        </div>

        <div class="stat-card">
            <div class="stat-value" id="unique-tracks">00</div>
            <div class="stat-label">UNIQUE TRACKS</div>
        </div>

        <div class="stat-card">
            <div class="stat-value" id="listening-time">00</div>
            <div class="stat-label">MINUTES LISTENED</div>
        </div>

    </div>
    
</section>
<section class="notes-section">

    <div class="section-heading">ASTRONOMER'S LOG</div>

    <div class="notes-description">
        thoughts, events, and memories.
    </div>

    <textarea
        id="daily-notes"
        placeholder="dear diary..."
        rows="8"
    ></textarea>
    <div class="save-area">
        <button id="save-notes" type="button">
            ▶︎ SAVE LOG
        </button>
        <span id="save-status">AWAITING LOG...</span>
    </div>

</section>
</main>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwJlk4VZMF5Nj655_IewCluMYDVtQ0QVan7v2dQwEkel6VbjfLHQ6zc_B8-KqFAdYqjig/exec";

const params = new URLSearchParams(window.location.search);
const dateString = params.get("date");

const selectedDate = dateString
    ? new Date(dateString + "T12:00:00")
    : new Date("2027-01-01T12:00:00");

const dateKey = [
    selectedDate.getFullYear(),
    String(selectedDate.getMonth() + 1).padStart(2, "0"),
    String(selectedDate.getDate()).padStart(2, "0")
].join("-");

const months = [
    "JANUARY", "FEBRUARY", "MARCH", "APRIL",
    "MAY", "JUNE", "JULY", "AUGUST",
    "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"
];

const month = months[selectedDate.getMonth()];
const day = String(selectedDate.getDate()).padStart(2, "0");
const year = selectedDate.getFullYear();

document.getElementById("entry-date").textContent =
    `${month} ${day}, ${year}`;

const calendarFiles = [
    "january.html", "february.html", "march.html",
    "april.html", "may.html", "june.html",
    "july.html", "august.html", "september.html",
    "october.html", "november.html", "december.html"
];

document.getElementById("back-link").href =
    `${calendarFiles[selectedDate.getMonth()]}?year=${year}`;

function getMoonPhase(date) {
    const julianDate = date.getTime() / 86400000 + 2440587.5;
    const lunarCycle = 29.530588853;
    const referenceNewMoon = 2451550.1;

    const age = (
        (julianDate - referenceNewMoon) % lunarCycle
        + lunarCycle
    ) % lunarCycle;

    const progress = age / lunarCycle;

    if (progress < 0.03 || progress >= 0.97) return 0;
    if (progress < 0.22) return 1;
    if (progress < 0.28) return 2;
    if (progress < 0.47) return 3;
    if (progress < 0.53) return 4;
    if (progress < 0.72) return 5;
    if (progress < 0.78) return 6;
    return 7;
}

const phase = getMoonPhase(selectedDate);

const phaseNames = [
    "NEW MOON", "WAXING CRESCENT", "FIRST QUARTER",
    "WAXING GIBBOUS", "FULL MOON", "WANING GIBBOUS",
    "THIRD QUARTER", "WANING CRESCENT"
];

const moon = document.getElementById("entry-moon");
moon.className = `entry-moon phase-${phase}`;
document.getElementById("phase-name").textContent = phaseNames[phase];

const notes = document.getElementById("daily-notes");
const status = document.getElementById("save-status");

function loadEntry() {
    status.textContent = "RETRIEVING LOG...";

    const noData = "No data found";

    const fields = {
        "song-title": "SONG TITLE",
        "song-artist": "ARTIST",
        "song-album": "ALBUM",
        "play-count": "PLAY COUNT",
        "total-plays": "TOTAL PLAYS",
        "unique-tracks": "UNIQUE TRACKS",
        "listening-time": "MINUTES LISTENED"
    };

    const script = document.createElement("script");

    window.handleDailyEntryResponse = function(entry) {
        script.remove();
        delete window.handleDailyEntryResponse;

        function displayValue(value) {
            return value !== null &&
                   value !== undefined &&
                   String(value).trim() !== ""
                ? value
                : noData;
        }

        if (entry.found === false) {
            Object.keys(fields).forEach(id => {
                document.getElementById(id).textContent = noData;
            });

            document.querySelector(".album-art span").textContent = noData;

            const spotifyLink = document.getElementById("spotify-link");
            spotifyLink.textContent = noData;
            spotifyLink.removeAttribute("href");

            notes.value = "";
            status.textContent = "NO DATA FOUND.";
            return;
        }

        Object.entries(fields).forEach(([id, field]) => {
            document.getElementById(id).textContent =
                displayValue(entry[field]);
        });

        // Album artwork
        const albumArt = document.querySelector(".album-art");
        const artwork = entry["ALBUM ARTWORK URL"];

        if (artwork && String(artwork).trim() !== "") {
            albumArt.style.backgroundImage = `url("${artwork}")`;
            albumArt.style.backgroundSize = "cover";
            albumArt.style.backgroundPosition = "center";
            albumArt.querySelector("span").style.display = "none";
        } else {
            albumArt.style.backgroundImage = "none";
            albumArt.querySelector("span").textContent = noData;
            albumArt.querySelector("span").style.display = "block";
        }

        // Spotify link
        const spotifyLink = document.getElementById("spotify-link");
        const spotify = entry["SPOTIFY LINK"];

        if (spotify && String(spotify).trim() !== "") {
            spotifyLink.href = spotify;
            spotifyLink.textContent = "▶︎ OPEN IN SPOTIFY";
        } else {
            spotifyLink.textContent = noData;
            spotifyLink.removeAttribute("href");
        }

        notes.value = entry["PERSONAL NOTES"] || "";
        status.textContent = "LOG RETRIEVED.";
    };

    script.onerror = function() {
        script.remove();
        delete window.handleDailyEntryResponse;
        status.textContent = "UNABLE TO LOAD LOG.";
    };

    script.src =
        `${API_URL}?date=${encodeURIComponent(dateKey)}` +
        `&callback=handleDailyEntryResponse`;

    document.body.appendChild(script);
}

async function saveEntry() {
    status.textContent = "SAVING LOG...";

    const entry = {
        date: dateKey,
        "Moon Phase": phaseNames[phase],
        "Personal Notes": notes.value
    };

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(entry)
        });

        const result = await response.json();

        if (result.success) {
            status.textContent = "LOG SAVED SUCCESSFULLY!";
        } else {
            status.textContent = "SAVE FAILED. TRY AGAIN.";
        }
    } catch (error) {
        console.error("Saving error:", error);
        status.textContent = "SAVE ERROR. CHECK CONNECTION.";
    }
}

document.getElementById("save-notes").addEventListener("click", saveEntry);

loadEntry();

</script>
</body>
</html>
