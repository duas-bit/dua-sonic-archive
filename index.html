
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sai's Sonic Archive</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #080B19;
    color: #F2D99A;
    font-family: monospace;
}

.sky {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(1px 1px at 10% 20%, #FFFFFF 99%, transparent),
        radial-gradient(1px 1px at 30% 70%, #F2D99A 99%, transparent),
        radial-gradient(2px 2px at 65% 35%, #FFFFFF 99%, transparent),
        radial-gradient(1px 1px at 85% 80%, #FFFFFF 99%, transparent),
        radial-gradient(1px 1px at 45% 15%, #F2D99A 99%, transparent),
        radial-gradient(2px 2px at 75% 55%, #FFFFFF 99%, transparent),
        radial-gradient(1px 1px at 20% 90%, #FFFFFF 99%, transparent),
        #080B19;

    background-size: 350px 350px;
}
    
.sky::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(ellipse at 20% 35%,
            rgba(76, 65, 133, 0.30),
            transparent 35%),

        radial-gradient(ellipse at 75% 25%,
            rgba(45, 76, 125, 0.25),
            transparent 40%),

        radial-gradient(ellipse at 55% 75%,
            rgba(113, 71, 112, 0.20),
            transparent 35%),

        radial-gradient(ellipse at 90% 70%,
            rgba(160, 119, 76, 0.12),
            transparent 30%);

    filter: blur(35px);
    pointer-events: none;
}
    
.sky::after {
    content: "";
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(2px 2px at 15% 25%, #FFFFFF 99%, transparent),
        radial-gradient(3px 3px at 40% 60%, #F2D99A 99%, transparent),
        radial-gradient(2px 2px at 80% 15%, #FFFFFF 99%, transparent),
        radial-gradient(2px 2px at 65% 85%, #FFFFFF 99%, transparent),
        radial-gradient(3px 3px at 90% 45%, #F2D99A 99%, transparent),
        radial-gradient(2px 2px at 30% 80%, #FFFFFF 99%, transparent);

    background-size: 550px 550px;
    animation: twinkle 4s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes twinkle {
    from {
        opacity: 0.35;
    }
    to {
        opacity: 1;
    }
}
    
.explorer {
    position: fixed;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: min(520px, 90vw);
    z-index: 2;
    image-rendering: pixelated;
    pointer-events: none;
}

.explorer svg {
    display: block;
    width: 100%;
    height: auto;
}
    
.home-content {
    position: fixed;
    inset: 0;
    z-index: 3;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 24px;
    padding-bottom: 100px;
}

.home-content h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(16px, 3vw, 30px);
    line-height: 1.8;
    letter-spacing: 3px;
    color: #F2D99A;
    text-shadow: 0 0 18px rgba(242, 217, 154, 0.35);
    margin: 0 0 35px;
}

.explore-button {
    padding: 15px 25px;
    background: transparent;
    border: none;
    color: #F2D99A;
    text-decoration: none;

    font-family: 'VT323', monospace;
    font-size: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;

    cursor: pointer;
    transition: 0.3s ease;
}

.explore-button:hover {
    background: #F2D99A;
    color: #080B19;
    box-shadow: 0 0 22px rgba(242, 217, 154, 0.35);
}
    
.sky {
    animation: skyDrift 120s linear infinite;
}

@keyframes skyDrift {
    from {
        background-position: 0 0;
    }
    to {
        background-position: 350px 350px;
    }
}
    
/* Allow character clicks through the homepage */
.home-content {
    pointer-events: none;
}

.explore-button {
    pointer-events: auto;
}

/* Interactive character */
.explorer {
    pointer-events: auto;
    cursor: pointer;
    z-index: 4;
}

/* NPC speech bubble */
.npc-bubble {
    position: absolute;
    left: 50%;
    top: -65px;
    transform: translateX(-50%) translateY(8px);

    width: 230px;
    padding: 12px 15px;

    background: #F2D99A;
    color: #171B35;
    border: 3px solid #171B35;

    font-family: 'VT323', monospace;
    font-size: 21px;
    text-align: center;

    opacity: 0;
    visibility: hidden;
    transition: 0.2s ease;
    pointer-events: none;
}

.npc-bubble::after {
    content: "";
    position: absolute;
    bottom: -10px;
    left: 50%;

    width: 14px;
    height: 14px;

    background: #F2D99A;
    border-right: 3px solid #171B35;
    border-bottom: 3px solid #171B35;

    transform: translateX(-50%) rotate(45deg);
}

.npc-bubble.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

/* Pixel-art celestial layer */
.celestial-layer {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
}

.constellations {
    width: 100%;
    height: 100%;
    opacity: 0.72;
}

.constellation path {
    fill: none;
    stroke: rgba(183, 169, 213, 0.48);
    stroke-width: 1.5;
    stroke-linecap: square;
    stroke-linejoin: miter;
}

.constellation rect {
    fill: #F2D99A;
    filter: drop-shadow(0 0 3px rgba(242, 217, 154, 0.8));
}
    
</style>
</head>

<body>

<div class="explorer"

     tabindex="0"
     aria-label="Talk to the explorer"

<div class="home-content">

    <h1>SAI'S SONIC ARCHIVE</h1>

<a href="solar-system.html" class="explore-button">▶︎ begin exploring</a>

</div>


<script>

const npcLines = [
    "The stars are particularly chatty tonight.",
    "Oh! A visitor. How exciting.",
    "I wonder what's hiding out there...",
    "Keep looking up. You never know.",
    "I've been expecting you. Probably.",
    "Do you think the stars have favourite songs?",
    "Just taking a little break from reality.",
    "The universe is bigger than my to-do list.",
    "Careful. Curiosity gets you everywhere.",
    "I saw something move out there. Maybe.",
    "Welcome to my little corner of the universe.",
    "I could stare at this sky forever.",
    "Somewhere out there, another explorer is looking up.",
    "Don't mind me. I'm on a very important mission.",
    "Psst... have you started exploring yet?"
];

let npcIndex = 0;

function nextNpcLine() {
    const bubble = document.getElementById("npcBubble");

    bubble.textContent = npcLines[npcIndex];
    bubble.classList.add("show");

    npcIndex = (npcIndex + 1) % npcLines.length;
}

</script>

</body>
</html>
